<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>蘭潭圖書館服務指南</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family:
                "Noto Sans TC",
                "Microsoft JhengHei",
                Arial,
                sans-serif;
            background: #f4f7fb;
            color: #263238;
        }

        /* =========================
           Header
        ========================= */

        header {
            background: linear-gradient(135deg, #1f4f7a, #3d78a8);
            color: white;
            padding: 45px 20px;
            text-align: center;
        }

        .school-name {
            font-size: 18px;
            margin-bottom: 10px;
            opacity: 0.95;
        }

        header h1 {
            margin: 0;
            font-size: 36px;
            letter-spacing: 2px;
        }

        /* =========================
           Main
        ========================= */

        main {
            max-width: 1100px;
            margin: 45px auto;
            padding: 0 20px;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }

        /* =========================
           Cards
        ========================= */

        .card {
            background: white;
            border-radius: 18px;
            padding: 35px 20px;
            text-align: center;
            box-shadow: 0 5px 18px rgba(0, 0, 0, 0.08);
            cursor: pointer;
            transition: 0.25s;
            border: 1px solid #e8edf2;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.12);
        }

        .card:focus {
            outline: 3px solid #7aa7d4;
            outline-offset: 3px;
        }

        .card .icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .card h3 {
            margin: 0;
            font-size: 20px;
            color: #1f4f7a;
        }

        /* =========================
           Modal
        ========================= */

        .modal {
            display: none;
            position: fixed;
            z-index: 999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.55);
            padding: 30px 15px;
            overflow-y: auto;
        }

        .modal.show {
            display: block;
        }

        .modal-content {
            background: white;
            max-width: 750px;
            margin: 30px auto;
            border-radius: 18px;
            padding: 30px;
            position: relative;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.2);
            animation: modalShow 0.2s ease;
        }

        @keyframes modalShow {
            from {
                transform: translateY(15px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .close {
            position: absolute;
            right: 20px;
            top: 12px;
            font-size: 32px;
            cursor: pointer;
            color: #777;
            line-height: 1;
        }

        .close:hover {
            color: #222;
        }

        .modal-title {
            color: #1f4f7a;
            font-size: 26px;
            margin: 0 40px 8px 0;
        }

        .modal-subtitle {
            color: #777;
            margin-bottom: 25px;
        }

        /* =========================
           Option Blocks
        ========================= */

        .option-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .option-block {
            display: flex;
            align-items: center;
            gap: 18px;
            padding: 20px;
            border-radius: 14px;
            background: #f5f8fb;
            border: 1px solid #e0e8ef;
            text-decoration: none;
            color: #263238;
            transition: 0.2s;
            cursor: pointer;
        }

        .option-block:hover {
            background: #eaf2f9;
            transform: translateX(4px);
        }

        .option-icon {
            font-size: 32px;
            min-width: 45px;
            text-align: center;
        }

        .option-block strong {
            color: #1f4f7a;
            font-size: 17px;
        }

        .option-block p {
            margin: 5px 0 0;
            color: #666;
            line-height: 1.6;
        }

        /* =========================
           Developing
        ========================= */

        .developing {
            text-align: center;
            padding: 40px 20px;
        }

        .developing-icon {
            font-size: 65px;
            margin-bottom: 15px;
        }

        .developing h3 {
            color: #1f4f7a;
            font-size: 24px;
            margin-bottom: 10px;
        }

        .developing p {
            color: #777;
            line-height: 1.8;
        }

        /* =========================
           Information Services
        ========================= */

        .info-content {
            width: 100%;
            text-align: left;
            line-height: 1.8;
            font-size: 15px;
        }

        .info-content p {
            margin: 8px 0;
        }

        .info-content strong {
            display: block;
            margin-top: 8px;
            margin-bottom: 4px;
            font-size: 17px;
            color: #1f4f7a;
        }

        .info-button {
            display: inline-block;
            margin-top: 10px;
            padding: 10px 18px;
            background: #1f4f7a;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: 0.2s;
        }

        .info-button:hover {
            background: #163a5c;
            transform: translateY(-1px);
        }

        /* =========================
           AI Chat
        ========================= */

        .ai-chat {
            width: 100%;
        }

        .ai-messages {
            height: 420px;
            overflow-y: auto;
            background: #f5f7fa;
            border: 1px solid #e1e7ed;
            border-radius: 14px;
            padding: 18px;
            margin-bottom: 15px;
        }

        .message {
            display: flex;
            margin-bottom: 14px;
        }

        .message.user {
            justify-content: flex-end;
        }

        .bubble {
            max-width: 88%;
            padding: 13px 17px;
            border-radius: 15px;
            line-height: 1.6;
            font-size: 15px;
        }

        .message.bot .bubble {
            background: white;
            border: 1px solid #e0e5ea;
        }

        .message.user .bubble {
            background: #1f4f7a;
            color: white;
        }

        .ai-input-area {
            display: flex;
            gap: 10px;
        }

        .ai-input {
            flex: 1;
            border: 1px solid #ccd5dd;
            border-radius: 10px;
            padding: 13px;
            font-size: 15px;
            outline: none;
        }

        .ai-input:focus {
            border-color: #1f4f7a;
        }

        .ai-send {
            border: none;
            border-radius: 10px;
            background: #1f4f7a;
            color: white;
            padding: 0 22px;
            font-size: 15px;
            cursor: pointer;
        }

        .ai-send:hover {
            background: #163a5c;
        }

        /* =========================
           Footer
        ========================= */

        footer {
            background: #173b5c;
            color: white;
            margin-top: 60px;
            padding: 40px 30px;
            text-align: left;
        }

        .footer-title-row {
            display: flex;
            align-items: baseline;
            gap: 18px;
            margin-bottom: 20px;
        }

        footer h3 {
            margin: 0;
            font-size: 28px;
            font-weight: bold;
        }

        .footer-address {
            font-size: 18px;
            opacity: 0.9;
        }

        .footer-info {
            line-height: 2;
            font-size: 18px;
            opacity: 0.95;
        }

        .library-home-button {
            display: inline-block;
            margin-top: 25px;
            padding: 13px 24px;
            background: white;
            color: #173b5c;
            text-decoration: none;
            border-radius: 9px;
            font-size: 17px;
            font-weight: bold;
            transition: 0.2s;
        }

        .library-home-button:hover {
            transform: translateY(-2px);
            background: #eef4f8;
        }

        /* =========================
           Responsive
        ========================= */

        @media (max-width: 800px) {

            header h1 {
                font-size: 30px;
            }

            .card-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .modal-content {
                max-width: 95%;
                padding: 25px;
            }
        }

        @media (max-width: 520px) {

            header {
                padding: 35px 15px;
            }

            header h1 {
                font-size: 25px;
                letter-spacing: 1px;
            }

            .school-name {
                font-size: 16px;
            }

            main {
                margin: 30px auto;
                padding: 0 15px;
            }

            .card-grid {
                grid-template-columns: 1fr;
                gap: 18px;
            }

            .card {
                padding: 28px 15px;
            }

            .modal {
                padding: 15px 8px;
            }

            .modal-content {
                padding: 22px 18px;
                margin: 15px auto;
            }

            .modal-title {
                font-size: 22px;
            }

            .option-block {
                padding: 15px;
                gap: 12px;
            }

            .option-icon {
                font-size: 28px;
                min-width: 38px;
            }

            .ai-messages {
                height: 450px;
            }

            .ai-input-area {
                flex-direction: column;
            }

            .ai-send {
                padding: 12px;
            }

            .info-content {
                font-size: 14px;
            }

            /* Footer 手機版 */

            .footer-title-row {
                flex-direction: column;
                align-items: flex-start;
                gap: 5px;
            }

            footer h3 {
                font-size: 24px;
            }

            .footer-address {
                font-size: 16px;
            }

            .footer-info {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         Header
    ========================= -->

    <header>

        <div class="school-name">
            📚 嘉義大學｜蘭潭圖書館
        </div>

        <h1>
            蘭潭圖書館服務指南
        </h1>

    </header>


    <!-- =========================
         Main
    ========================= -->

    <main>

        <div class="card-grid">

            <!-- 1. 館藏與閱讀資源 -->
            <div
                class="card"
                onclick="openCollection()"
                tabindex="0"
                onkeydown="cardKey(event, openCollection)"
            >

                <div class="icon">
                    📚
                </div>

                <h3>
                    館藏與閱讀資源
                </h3>

            </div>


            <!-- 2. 學習與自修空間 -->
            <div
                class="card"
                onclick="openDeveloping(
                    '📖 學習與自修空間',
                    '自修空間相關功能'
                )"
                tabindex="0"
                onkeydown="cardKey(event, () =>
                    openDeveloping(
                        '📖 學習與自修空間',
                        '自修空間相關功能'
                    )
                )"
            >

                <div class="icon">
                    📖
                </div>

                <h3>
                    學習與自修空間
                </h3>

            </div>


            <!-- 3. 視聽與會議設施 -->
            <div
                class="card"
                onclick="openAudioMeeting()"
                tabindex="0"
                onkeydown="cardKey(event, openAudioMeeting)"
            >

                <div class="icon">
                    🎬
                </div>

                <h3>
                    視聽與會議設施
                </h3>

            </div>


            <!-- 4. 藝文展覽功能 -->
            <div
                class="card"
                onclick="openArt()"
                tabindex="0"
                onkeydown="cardKey(event, openArt)"
            >

                <div class="icon">
                    🎨
                </div>

                <h3>
                    藝文展覽功能
                </h3>

            </div>


            <!-- 5. 資訊與技術支援 -->
            <div
                class="card"
                onclick="openInformationServices()"
                tabindex="0"
                onkeydown="cardKey(event, openInformationServices)"
            >

                <div class="icon">
                    💻
                </div>

                <h3>
                    資訊與技術支援
                </h3>

            </div>


            <!-- 6. AI -->
            <div
                class="card"
                onclick="openAI()"
                tabindex="0"
                onkeydown="cardKey(event, openAI)"
            >

                <div class="icon">
                    🤖
                </div>

                <h3>
                    圖書館 AI 小幫手
                </h3>

            </div>

        </div>

    </main>


    <!-- =========================
         Modal
    ========================= -->

    <div
        class="modal"
        id="infoModal"
        onclick="closeModalOutside(event)"
    >

        <div class="modal-content">

            <span
                class="close"
                onclick="closeInfo()"
            >
                ×
            </span>

            <h2
                class="modal-title"
                id="modalTitle"
            ></h2>

            <div
                class="modal-subtitle"
                id="modalSubtitle"
            ></div>

            <div id="modalBody"></div>

        </div>

    </div>


    <!-- =========================
         Footer
    ========================= -->

    <footer>

        <div class="footer-title-row">

            <h3>
                📚 蘭潭圖書資訊處
            </h3>

            <div class="footer-address">
                地址:嘉義市鹿寮里學府路300號
            </div>

        </div>


        <div class="footer-info">

            TEL: 05-2717233（圖書諮詢）
            <br>

            TEL: 2717260~62（校務行政，輔助教學平台）
            <br>

            TEL: 05-2717259（網路，電子郵件）
            <br>

            TEL: 05-2717238（論文系統諮詢）
            <br>

            TEL: 05-2717258（資訊諮詢）

        </div>


        <a
            class="library-home-button"
            href="https://website.ncyu.edu.tw/lib/"
            target="_blank"
        >
            🌐 前往嘉大圖書館首頁
        </a>

    </footer>


    <!-- =========================
         JavaScript
    ========================= -->

    <script>

        const modal =
            document.getElementById("infoModal");

        const modalTitle =
            document.getElementById("modalTitle");

        const modalSubtitle =
            document.getElementById("modalSubtitle");

        const modalBody =
            document.getElementById("modalBody");


        /* =========================
           Keyboard
        ========================= */

        function cardKey(event, callback) {

            if (
                event.key === "Enter" ||
                event.key === " "
            ) {

                event.preventDefault();

                callback();
            }
        }


        /* =========================
           Open Collection
        ========================= */

        function openCollection() {

            modalTitle.textContent =
                "📚 館藏與閱讀資源";

            modalSubtitle.textContent =
                "查找圖書館館藏與電子閱讀資源";

            modalBody.innerHTML = `

                <div class="option-list">

                    <a
                        class="option-block"
                        href="https://libaleph.ncyu.edu.tw/F/ET2CV68F9UYV7HJ14FR12684DKYPYS4NTXPR8RSBRUSE6XDKVQ-01688?&pds_handle=GUEST"
                        target="_blank"
                    >

                        <div class="option-icon">
                            📚
                        </div>

                        <div>

                            <strong>
                                館藏查詢
                            </strong>

                            <p>
                                查詢圖書館目前的書籍、
                                期刊及其他館藏資料。
                            </p>

                        </div>

                    </a>


                    <a
                        class="option-block"
                        href="https://website.ncyu.edu.tw/lib/Subject?nodeId=44461"
                        target="_blank"
                    >

                        <div class="option-icon">
                            📱
                        </div>

                        <div>

                            <strong>
                                電子書查詢
                            </strong>

                            <p>
                                查詢圖書館提供的電子書與電子閱讀資源。
                            </p>

                        </div>

                    </a>

                </div>
            `;

            modal.classList.add("show");
        }


        /* =========================
           Developing
        ========================= */

        function openDeveloping(
            title,
            subtitle
        ) {

            modalTitle.textContent =
                title;

            modalSubtitle.textContent =
                subtitle;

            modalBody.innerHTML = `

                <div class="developing">

                    <div class="developing-icon">
                        🚧
                    </div>

                    <h3>
                        等待學校開發中
                    </h3>

                    <p>
                        此功能目前正在規劃與開發中，
                        未來將提供更完整的圖書館服務。
                    </p>

                </div>
            `;

            modal.classList.add("show");
        }


        /* =========================
           Audio / Meeting
        ========================= */

        function openAudioMeeting() {

            modalTitle.textContent =
                "🎬 視聽與會議設施";

            modalSubtitle.textContent =
                "視聽空間與相關館藏資訊";

            modalBody.innerHTML = `

                <div class="option-list">

                    <a
                        class="option-block"
                        href="https://website.ncyu.edu.tw/lib/Contents?nodeId=61819"
                        target="_blank"
                    >

                        <div class="option-icon">
                            🎬
                        </div>

                        <div>

                            <strong>
                                視聽團體室、會議室預約
                            </strong>

                            <p>
                                查看視聽團體室與會議室相關資訊及預約方式。
                            </p>

                        </div>

                    </a>


                    <div
                        class="option-block"
                        onclick="openDeveloping(
                            '🎞️ 館藏電影的清單',
                            '圖書館電影館藏'
                        )"
                    >

                        <div class="option-icon">
                            🎞️
                        </div>

                        <div>

                            <strong>
                                館藏電影的清單
                            </strong>

                            <p>
                                查看圖書館電影相關館藏。
                            </p>

                        </div>

                    </div>

                </div>
            `;

            modal.classList.add("show");
        }


        /* =========================
           Art / Exhibition
        ========================= */

        function openArt() {

            modalTitle.textContent =
                "🎨 藝文展覽功能";

            modalSubtitle.textContent =
                "嘉大蘭潭圖書館藝文與相關資訊";

            modalBody.innerHTML = `

                <div class="option-list">

                    <!-- 新聞剪報 -->

                    <a
                        class="option-block"
                        href="https://website.ncyu.edu.tw/lib/Subject?nodeId=1669"
                        target="_blank"
                    >

                        <div class="option-icon">
                            📰
                        </div>

                        <div>

                            <strong>
                                新聞剪報
                            </strong>

                            <p>
                                查看嘉義大學圖書館相關新聞與活動報導。
                            </p>

                        </div>

                    </a>


                    <!-- 郭東榮 -->

                    <a
                        class="option-block"
                        href="https://www.ncyu.edu.tw/ncyu/Subject/Detail/212412?nodeId=835"
                        target="_blank"
                    >

                        <div class="option-icon">
                            🖼️
                        </div>

                        <div>

                            <strong>
                                郭東榮作品展
                            </strong>

                            <p>
                                欣賞郭東榮藝術作品及相關展覽資訊。
                            </p>

                        </div>

                    </a>


                    <!-- 蕭萬長 -->

                    <a
                        class="option-block"
                        href="https://website.ncyu.edu.tw/vincentsiew/"
                        target="_blank"
                    >

                        <div class="option-icon">
                            🏛️
                        </div>

                        <div>

                            <strong>
                                蕭萬長文物館
                            </strong>

                            <p>
                                了解蕭萬長文物館及相關典藏資訊。
                            </p>

                        </div>

                    </a>


                    <!-- 混沌圓成 -->

                    <a
                        class="option-block"
                        href="https://website.ncyu.edu.tw/lib/ServerFile/Get/24a08d7e-8b08-4d18-856f-26f070f166f8?nodeId=1669&sId=240915"
                        target="_blank"
                    >

                        <div class="option-icon">
                            🌀
                        </div>

                        <div>

                            <strong>
                                混沌&圓成展覽
                            </strong>

                            <p>
                                查看混沌&圓成相關展覽資訊。
                            </p>

                        </div>

                    </a>

                </div>
            `;

            modal.classList.add("show");
        }


        /* =========================
           Information Services
        ========================= */

        function openInformationServices() {

            modalTitle.textContent =
                "💻 資訊與技術支援";

            modalSubtitle.textContent =
                "嘉大蘭潭圖書館資訊服務";

            modalBody.innerHTML = `

                <div class="info-content">

                    <p>
                        嘉大蘭潭圖書館提供多項資訊服務，
                        協助學生進行課程學習、資料查詢與研究。
                    </p>


                    <br>


                    <strong>
                        🌐 網路與電腦服務
                    </strong>

                    <p>
                        館內提供網路及電腦設備，
                        方便學生進行資料查詢、網路學習與研究工作。
                    </p>


                    <br>


                    <strong>
                        🔎 館藏與資料檢索
                    </strong>

                    <p>
                        可以使用館藏查詢系統搜尋書籍、
                        期刊及其他館藏資料，
                        協助快速找到需要的學習資源。
                    </p>


                    <br>


                    <strong>
                        🗂️ 電子資料庫與電子資源
                    </strong>

                    <p>
                        提供電子資料庫、電子期刊及電子書等資源，
                        可用於課程報告、專題研究與學術資料蒐集。
                    </p>


                    <a
                        class="info-button"
                        href="https://libproxy.ncyu.edu.tw/er/search/?query_term=&query_field=ti&query_op=&match_type=phrase&filter_bool=and&filter_term=DB&filter_field=type.raw&filter_op=term&hot_days=30"
                        target="_blank"
                    >
                        🔎 前往電子資料庫查詢
                    </a>


                    <br><br>


                    <strong>
                        🖨️ 列印、影印與掃描
                    </strong>

                    <p>
                        館內一樓提供列印、影印及掃描設備，
                        方便學生處理課程資料、報告及其他學習文件。
                    </p>


                    <br>


                    <strong>
                        🎬 線上影音公播平台
                    </strong>

                    <p>
                        提供線上影音資源，
                        讓學生可以透過圖書資訊處提供的平台，
                        查閱及使用相關影音內容，
                        作為課程學習與休閒使用。
                    </p>


                    <a
                        class="info-button"
                        href="https://www.ncyu.edu.tw/lib/Contents?nodeId=62867"
                        target="_blank"
                    >
                        🎬 前往線上影音公播平台
                    </a>


                    <br><br>


                    <strong>
                        👩‍🏫 館員資訊服務
                    </strong>


                    <p>
                        如果不知道如何尋找特定資料，
                        或不清楚如何使用圖書館資源，
                        可以向館員尋求協助，
                        取得相關資源與檢索指引。
                    </p>

                </div>
            `;

            modal.classList.add("show");
        }


        /* =========================
           AI Assistant
        ========================= */

        function openAI() {

            modalTitle.textContent =
                "🤖 圖書館 AI 小幫手";

            modalSubtitle.textContent =
                "有關圖書館服務的問題都可以問問看";

            modalBody.innerHTML = `

                <div class="ai-chat">

                    <div
                        class="ai-messages"
                        id="aiMessages"
                    >

                        <div class="message bot">

                            <div class="bubble">

                                👋 你好！我是蘭潭圖書館 AI 小幫手。

                                <br><br>

                                你可以問我：

                                <br>

                                • 哪裡可以找書？

                                <br>

                                • 圖書館有電子書嗎？

                                <br>

                                • 哪裡可以印東西？

                                <br>

                                • 會議室怎麼預約？

                                <br>

                                • 圖書館有什麼展覽？

                                <br>

                                • 有電腦或 Wi-Fi 嗎？

                            </div>

                        </div>

                    </div>


                    <div class="ai-input-area">

                        <input
                            id="aiInput"
                            class="ai-input"
                            type="text"
                            placeholder="輸入你的問題..."
                            onkeydown="handleAIEnter(event)"
                        >

                        <button
                            class="ai-send"
                            onclick="askAI()"
                        >
                            發送
                        </button>

                    </div>

                </div>
            `;

            modal.classList.add("show");


            setTimeout(() => {

                const input =
                    document.getElementById("aiInput");

                if (input) {

                    input.focus();

                }

            }, 100);
        }


        /* =========================
           AI Enter
        ========================= */

        function handleAIEnter(event) {

            if (event.key === "Enter") {

                event.preventDefault();

                askAI();

            }
        }


        /* =========================
           Ask AI
        ========================= */

        function askAI() {

            const input =
                document.getElementById("aiInput");

            const messages =
                document.getElementById("aiMessages");

            if (!input || !messages) {

                return;

            }


            const question =
                input.value.trim();

            if (question === "") {

                return;

            }


            /* 使用者訊息 */

            const userMessage =
                document.createElement("div");

            userMessage.className =
                "message user";

            userMessage.innerHTML = `

                <div class="bubble">

                    ${escapeHTML(question)}

                </div>

            `;

            messages.appendChild(userMessage);


            input.value = "";


            /* AI 回覆 */

            const answer =
                getAIAnswer(question);

            const botMessage =
                document.createElement("div");

            botMessage.className =
                "message bot";

            botMessage.innerHTML = `

                <div class="bubble">

                    ${answer}

                </div>

            `;

            messages.appendChild(botMessage);


            messages.scrollTop =
                messages.scrollHeight;
        }


        /* =========================
           AI Answers
        ========================= */

        function getAIAnswer(question) {

            const q =
                question.toLowerCase();


            /* 自習 */

            if (
                q.includes("自習") ||
                q.includes("座位") ||
                q.includes("位置") ||
                q.includes("有位子")
            ) {

                return `

                    📖 圖書館有學習與自修空間。

                    <br><br>

                    目前網站尚未連接即時座位系統，
                    所以我無法確認現在是否還有空位。

                `;
            }


            /* 找書 */

            if (
                q.includes("找書") ||
                q.includes("哪裡找書") ||
                q.includes("查書") ||
                q.includes("館藏")
            ) {

                return `

                    📚 你可以使用「館藏查詢」功能
                    搜尋圖書館的書籍、期刊及其他館藏資料。

                    <br><br>

                    請回到首頁點選
                    「館藏與閱讀資源」。

                `;
            }


            /* 電子書 */

            if (
                q.includes("電子書") ||
                q.includes("電子資源") ||
                q.includes("資料庫")
            ) {

                return `

                    📱 圖書館提供電子書與電子資源。

                    <br><br>

                    你可以回到首頁，
                    點選「館藏與閱讀資源」，
                    使用電子書查詢功能。

                    <br><br>

                    如果要查詢電子資料庫，
                    可以到「資訊與技術支援」。

                `;
            }


            /* 列印 */

            if (
                q.includes("列印") ||
                q.includes("印東西") ||
                q.includes("印")
            ) {

                return `

                    🖨️ 圖書館一樓提供
                    列印、影印與掃描設備。

                `;
            }


            /* 會議室 */

            if (
                q.includes("會議室") ||
                q.includes("團體室") ||
                q.includes("預約")
            ) {

                return `

                    🎬 你可以使用
                    「視聽與會議設施」功能。

                    <br><br>

                    裡面有
                    「視聽團體室、會議室預約」
                    的連結。

                `;
            }


            /* 電腦 / 網路 */

            if (
                q.includes("電腦") ||
                q.includes("網路") ||
                q.includes("wifi") ||
                q.includes("wi-fi")
            ) {

                return `

                    🌐 圖書館提供網路與電腦相關資訊服務，
                    可以協助學生進行資料查詢、
                    網路學習與研究工作。

                `;
            }


            /* 展覽 */

            if (
                q.includes("展覽") ||
                q.includes("藝文") ||
                q.includes("作品")
            ) {

                return `

                    🎨 你可以點選首頁的
                    「藝文展覽功能」。

                    <br><br>

                    裡面可以查看新聞剪報、
                    郭東榮作品展、
                    蕭萬長文物館以及
                    混沌&圓成展覽等資訊。

                `;
            }


            /* 開放時間 */

            if (
                q.includes("開放") ||
                q.includes("幾點") ||
                q.includes("時間")
            ) {

                return `

                    🕐 關於圖書館最新開放時間，
                    建議查看嘉義大學圖書館官方網站
                    的最新公告。

                `;
            }


            /* 線上影音 */

            if (
                q.includes("影音") ||
                q.includes("電影") ||
                q.includes("影片")
            ) {

                return `

                    🎬 圖書館有線上影音公播平台。

                    <br><br>

                    你可以到首頁的
                    「資訊與技術支援」，
                    點選「線上影音公播平台」
                    查看相關資訊。

                `;
            }


            /* Default */

            return `

                🤖 我目前可以協助你了解：

                <br><br>

                📚 館藏查詢

                <br>

                📱 電子書

                <br>

                🖨️ 列印、影印與掃描

                <br>

                🎬 會議室與團體室

                <br>

                🎨 藝文展覽

                <br>

                💻 電腦與網路

                <br>

                🎞️ 線上影音

                <br><br>

                你可以直接輸入想知道的服務。

            `;
        }


        /* =========================
           Escape HTML
        ========================= */

        function escapeHTML(text) {

            const div =
                document.createElement("div");

            div.textContent =
                text;

            return div.innerHTML;
        }


        /* =========================
           Close Modal
        ========================= */

        function closeInfo() {

            modal.classList.remove("show");
        }


        function closeModalOutside(event) {

            if (event.target === modal) {

                closeInfo();

            }
        }


        /* =========================
           ESC
        ========================= */

        document.addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Escape") {

                    closeInfo();

                }

            }
        );

    </script>

</body>
