<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>嘉義大學蘭潭圖書館｜服務指南</title>

<style>

:root{
  --navy:#17365d;
  --blue:#2d6cdf;
  --light:#f5f8fc;
  --text:#243447;
  --muted:#6b7785;
  --card:#ffffff;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;
  background:var(--light);
  color:var(--text);
}


/* ===== Header ===== */

header{
  background:linear-gradient(135deg,#17365d,#2d6cdf);
  color:#fff;
  padding:38px 20px 55px;
}

.wrap{
  max-width:1050px;
  margin:auto;
}

.top{
  display:flex;
  justify-content:flex-start;
  align-items:center;
  gap:20px;
}

.logo{
  font-size:20px;
  font-weight:800;
}

.hero{
  margin-top:35px;
}

h1{
  font-size:clamp(30px,5vw,50px);
  margin:0;
  line-height:1.15;
}


/* ===== Main ===== */

main{
  padding-bottom:40px;
}

section{
  padding:35px 0;
}


/* ===== Cards ===== */

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
}

.card{
  background:var(--card);
  border-radius:18px;
  padding:24px;
  box-shadow:0 5px 18px #17365d12;
  border:1px solid #e7edf5;
  cursor:pointer;
  transition:.2s;
}

.card:hover{
  transform:translateY(-4px);
  box-shadow:0 10px 24px #17365d18;
}

.card:focus{
  outline:3px solid #2d6cdf55;
}

.icon{
  font-size:36px;
}

.card h3{
  margin:14px 0 8px;
  font-size:20px;
}

.card p{
  margin:0;
  color:var(--muted);
  font-size:14px;
  line-height:1.7;
}


/* ===== Modal ===== */

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:#0008;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:10;
}

.modal.show{
  display:flex;
}

.modalbox{
  background:#fff;
  border-radius:20px;
  max-width:600px;
  width:100%;
  padding:28px;
  max-height:85vh;
  overflow:auto;
  box-shadow:0 15px 50px #0004;
}

.close{
  float:right;
  border:0;
  background:#eef3f8;
  border-radius:50%;
  width:36px;
  height:36px;
  font-size:20px;
  cursor:pointer;
}

.close:hover{
  background:#dfe7f0;
}

.modalbox h2{
  margin-top:5px;
  padding-right:45px;
}

.modal-sub{
  color:var(--blue);
  font-weight:700;
  margin-bottom:18px;
}

.modal-text{
  white-space:pre-line;
  line-height:1.8;
  color:var(--text);
}


/* ===== 彈出選項 ===== */

.option{
  display:block;
  text-decoration:none;
  color:var(--text);
  background:#f5f8fc;
  border:1px solid #e1e8f0;
  border-radius:15px;
  padding:18px;
  margin-top:14px;
  transition:.2s;
  cursor:pointer;
}

.option:hover{
  background:#eef4ff;
  border-color:#2d6cdf;
  transform:translateY(-2px);
}

.option-title{
  font-size:18px;
  font-weight:800;
  margin-bottom:5px;
}

.option-text{
  font-size:14px;
  color:var(--muted);
}


/* ===== 等待開發 ===== */

.developing{
  text-align:center;
  padding:30px 15px;
  background:#f5f8fc;
  border-radius:15px;
  border:1px solid #e1e8f0;
}

.developing-icon{
  font-size:45px;
  margin-bottom:12px;
}

.developing-title{
  font-size:20px;
  font-weight:800;
  margin-bottom:8px;
}

.developing-text{
  color:var(--muted);
  font-size:14px;
}


/* ===== 手機版 ===== */

@media(max-width:800px){

  .grid{
    grid-template-columns:repeat(2,1fr);
  }

}

@media(max-width:520px){

  header{
    padding:30px 18px 45px;
  }

  .hero{
    margin-top:28px;
  }

  .grid{
    grid-template-columns:1fr;
  }

  section{
    padding:25px 18px 35px;
  }

}

</style>
</head>


<body>


<!-- ===== Header ===== -->

<header>

  <div class="wrap">

    <div class="top">

      <div class="logo">
        📚 嘉義大學｜蘭潭圖書館
      </div>

    </div>


    <div class="hero">

      <h1>
        蘭潭圖書館服務指南
      </h1>

    </div>

  </div>

</header>



<!-- ===== Main ===== -->

<main class="wrap">

  <section>

    <div class="grid" id="cards">


      <!-- 1. 館藏與閱讀資源 -->

      <div
        class="card"
        tabindex="0"
        onclick="openCollection()"
      >

        <div class="icon">
          📚
        </div>

        <h3>
          館藏與閱讀資源
        </h3>

        <p>
          實體書籍、期刊、電子資源與輕鬆閱讀區。
        </p>

      </div>



      <!-- 2. 學習與自修空間 -->

      <div
        class="card"
        tabindex="0"
        onclick="openDeveloping('📖 學習與自修空間')"
      >

        <div class="icon">
          📖
        </div>

        <h3>
          學習與自修空間
        </h3>

        <p>
          閱覽座位、學習共享空間、筆電專區與 B1 自修室。
        </p>

      </div>



      <!-- 3. 視聽與會議設施 -->

      <div
        class="card"
        tabindex="0"
        onclick="openAudioMeeting()"
      >

        <div class="icon">
          🎬
        </div>

        <h3>
          視聽與會議設施
        </h3>

        <p>
          視聽團體室、會議室與館藏電影等服務。
        </p>

      </div>



      <!-- 4. 藝文展覽功能 -->

      <div
        class="card"
        tabindex="0"
        onclick="openArt()"
      >

        <div class="icon">
          🎨
        </div>

        <h3>
          藝文展覽功能
        </h3>

        <p>
          藝文系列展、作品展與特色文物展覽。
        </p>

      </div>



      <!-- 5. 資訊與技術支援 -->

      <div
        class="card"
        tabindex="0"
        onclick="openInfo(
          '💻 資訊與技術支援',
          '研究工具與資訊服務',
          '館內提供校園網路、電腦教室、圖書資源檢索及電子資料庫等資訊服務。\\n\\n同時提供掃描、影印與列印設備，以及各學科主題館員的資源指引服務，協助學生進行學習與研究。'
        )"
      >

        <div class="icon">
          💻
        </div>

        <h3>
          資訊與技術支援
        </h3>

        <p>
          電腦、網路、資料檢索、掃描、影印與列印服務。
        </p>

      </div>



      <!-- 6. 圖書館服務與讀者支援 -->

      <div
        class="card"
        tabindex="0"
        onclick="openInfo(
          '🤝 圖書館服務與讀者支援',
          '協助讀者使用圖書館資源',
          '圖書館提供借閱服務、新書資訊、活動公告及各項讀者服務。\\n\\n當學生遇到找不到書籍、資料庫使用問題或不清楚服務位置時，可以透過圖書館網站或向館員尋求協助。'
        )"
      >

        <div class="icon">
          🤝
        </div>

        <h3>
          圖書館服務與讀者支援
        </h3>

        <p>
          借閱服務、新書資訊、公告活動與館員協助。
        </p>

      </div>


    </div>

  </section>

</main>



<!-- ===== Modal ===== -->

<div
  class="modal"
  id="modal"
  onclick="if(event.target===this) closeInfo()"
>

  <div class="modalbox">

    <button
      class="close"
      onclick="closeInfo()"
      aria-label="關閉"
    >
      ×
    </button>

    <h2 id="modalTitle">
      功能名稱
    </h2>

    <div
      class="modal-sub"
      id="modalSub"
    >
      功能說明
    </div>

    <div
      class="modal-text"
      id="modalText"
    >
      詳細內容
    </div>

  </div>

</div>



<!-- ===== JavaScript ===== -->

<script>


/* ===== 一般功能說明 ===== */

function openInfo(title, sub, text) {

  document.getElementById("modalTitle").textContent = title;

  document.getElementById("modalSub").textContent = sub;

  document.getElementById("modalText").textContent = text;

  document.getElementById("modal").classList.add("show");

}


/* ===== 館藏與閱讀資源 ===== */

function openCollection() {

  document.getElementById("modalTitle").textContent =
    "📚 館藏與閱讀資源";

  document.getElementById("modalSub").textContent =
    "選擇你要查詢的資源";

  document.getElementById("modalText").innerHTML = `

    <a
      class="option"
      href="https://libaleph.ncyu.edu.tw/F/ET2CV68F9UYV7HJ14FR12684DKYPYS4NTXPR8RSBRUSE6XDKVQ-01688?&pds_handle=GUEST"
      target="_blank"
      rel="noopener noreferrer"
    >

      <div class="option-title">
        📚 實體書籍查詢
      </div>

      <div class="option-text">
        查詢圖書館實體書籍、期刊等館藏資料
      </div>

    </a>


    <a
      class="option"
      href="https://website.ncyu.edu.tw/lib/Subject?nodeId=44461"
      target="_blank"
      rel="noopener noreferrer"
    >

      <div class="option-title">
        📱 電子書查詢
      </div>

      <div class="option-text">
        查詢圖書館提供的電子書與電子資源
      </div>

    </a>

  `;

  document.getElementById("modal").classList.add("show");

}



/* ===== 學習與自修空間 ===== */

function openDeveloping(title) {

  document.getElementById("modalTitle").textContent = title;

  document.getElementById("modalSub").textContent =
    "功能開發中";

  document.getElementById("modalText").innerHTML = `

    <div class="developing">

      <div class="developing-icon">
        🚧
      </div>

      <div class="developing-title">
        等待學校開發中
      </div>

      <div class="developing-text">
        此功能目前尚在規劃與開發階段，敬請期待。
      </div>

    </div>

  `;

  document.getElementById("modal").classList.add("show");

}



/* ===== 視聽與會議設施 ===== */

function openAudioMeeting() {

  document.getElementById("modalTitle").textContent =
    "🎬 視聽與會議設施";

  document.getElementById("modalSub").textContent =
    "選擇你需要的服務";

  document.getElementById("modalText").innerHTML = `

    <a
      class="option"
      href="https://website.ncyu.edu.tw/lib/Contents?nodeId=61819"
      target="_blank"
      rel="noopener noreferrer"
    >

      <div class="option-title">
        🎬 視聽團體室、會議室預約
      </div>

      <div class="option-text">
        查看視聽團體室及會議室相關資訊與預約服務
      </div>

    </a>


    <div
      class="option"
      onclick="openDeveloping('🎞️ 館藏電影的清單')"
    >

      <div class="option-title">
        🎞️ 館藏電影的清單
      </div>

      <div class="option-text">
        查看圖書館館藏電影
      </div>

    </div>

  `;

  document.getElementById("modal").classList.add("show");

}



/* ===== 藝文展覽 ===== */

function openArt() {

  document.getElementById("modalTitle").textContent =
    "🎨 藝文展覽功能";

  document.getElementById("modalSub").textContent =
    "選擇你想參觀的展覽";

  document.getElementById("modalText").innerHTML = `

    <a
      class="option"
      href="https://www.ncyu.edu.tw/ncyu/Subject/Detail/244673?nodeId=835"
      target="_blank"
      rel="noopener noreferrer"
    >

      <div class="option-title">
        🎨 藝文系列展
      </div>

      <div class="option-text">
        查看嘉義大學藝文系列展相關資訊
      </div>

    </a>


    <a
      class="option"
      href="https://www.ncyu.edu.tw/ncyu/Subject/Detail/212412?nodeId=835"
      target="_blank"
      rel="noopener noreferrer"
    >

      <div class="option-title">
        🖼️ 郭東榮作品展
      </div>

      <div class="option-text">
        查看郭東榮作品展相關資訊
      </div>

    </a>


    <a
      class="option"
      href="https://website.ncyu.edu.tw/vincentsiew/"
      target="_blank"
      rel="noopener noreferrer"
    >

      <div class="option-title">
        🏛️ 蕭萬長文物館
      </div>

      <div class="option-text">
        進入蕭萬長文物館網站
      </div>

    </a>


    <a
      class="option"
      href="https://website.ncyu.edu.tw/lib/ServerFile/Get/24a08d7e-8b08-4d18-856f-26f070f166f8?nodeId=1669&sId=240915"
      target="_blank"
      rel="noopener noreferrer"
    >

      <div class="option-title">
        🌀 混沌&圓成展覽
      </div>

      <div class="option-text">
        查看混沌&圓成展覽相關資料
      </div>

    </a>

  `;

  document.getElementById("modal").classList.add("show");

}



/* ===== 關閉視窗 ===== */

function closeInfo() {

  document.getElementById("modal").classList.remove("show");

}


/* ===== 支援鍵盤操作 ===== */

document.querySelectorAll("#cards .card").forEach(card => {

  card.addEventListener("keydown", event => {

    if(event.key === "Enter" || event.key === " ") {

      event.preventDefault();

      card.click();

    }

  });

});


/* ===== ESC 關閉視窗 ===== */

document.addEventListener("keydown", event => {

  if(event.key === "Escape") {

    closeInfo();

  }

});

</script>


</body>
</html>
