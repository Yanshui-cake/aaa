<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>嘉義大學蘭潭圖書館｜服務指南</title>

<style>
:root{
  --navy:#17365d;
  --blue:#2d6cdf;
  --light:#f5f8fc;
  --text:#243447;
  --muted:#6b7785;
  --card:#ffffff;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;
  background:var(--light);
  color:var(--text);
}

/* 頁首 */
header{
  background:linear-gradient(135deg,#17365d,#2d6cdf);
  color:#fff;
  padding:38px 20px 55px;
}

.wrap{
  max-width:1050px;
  margin:auto;
}

.top{
  display:flex;
  justify-content:flex-start;
  align-items:center;
  gap:20px;
}

.logo{
  font-size:20px;
  font-weight:800;
}

.hero{
  margin-top:35px;
}

h1{
  font-size:clamp(30px,5vw,50px);
  margin:0;
  line-height:1.15;
}

/* 卡片 */
main{
  padding-bottom:40px;
}

section{
  padding:35px 0;
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
}

.card{
  background:var(--card);
  border-radius:18px;
  padding:24px;
  box-shadow:0 5px 18px #17365d12;
  border:1px solid #e7edf5;
  cursor:pointer;
  transition:.2s;
}

.card:hover{
  transform:translateY(-4px);
  box-shadow:0 10px 24px #17365d18;
}

.card:focus{
  outline:3px solid #2d6cdf55;
}

.icon{
  font-size:36px;
}

.card h3{
  margin:14px 0 8px;
  font-size:20px;
}

.card p{
  margin:0;
  color:var(--muted);
  font-size:14px;
  line-height:1.7;
}

/* 彈出視窗 */
.modal{
  display:none;
  position:fixed;
  inset:0;
  background:#0008;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:10;
}

.modal.show{
  display:flex;
}

.modalbox{
  background:#fff;
  border-radius:20px;
  max-width:600px;
  width:100%;
  padding:28px;
  max-height:85vh;
  overflow:auto;
  box-shadow:0 15px 50px #0004;
}

.close{
  float:right;
  border:0;
  background:#eef3f8;
  border-radius:50%;
  width:36px;
  height:36px;
  font-size:20px;
  cursor:pointer;
}

.close:hover{
  background:#dfe7f0;
}

.modalbox h2{
  margin-top:5px;
  padding-right:45px;
}

.modal-sub{
  color:var(--blue);
  font-weight:700;
  margin-bottom:18px;
}

.modal-text{
  white-space:pre-line;
  line-height:1.8;
  color:var(--text);
}

/* 選項 */
.option{
  display:block;
  text-decoration:none;
  color:var(--text);
  background:#f5f8fc;
  border:1px solid #e1e8f0;
  border-radius:15px;
  padding:18px;
  margin-top:14px;
  transition:.2s;
  cursor:pointer;
}

.option:hover{
  background:#eef4ff;
  border-color:#2d6cdf;
  transform:translateY(-2px);
}

.option-title{
  font-size:18px;
  font-weight:800;
  margin-bottom:5px;
}

.option-text{
  font-size:14px;
  color:var(--muted);
}

/* 開發中 */
.developing{
  text-align:center;
  padding:30px 15px;
  background:#f5f8fc;
  border-radius:15px;
  border:1px solid #e1e8f0;
}

.developing-icon{
  font-size:45px;
  margin-bottom:12px;
}

.developing-title{
  font-size:20px;
  font-weight:800;
  margin-bottom:8px;
}

.developing-text{
  color:var(--muted);
  font-size:14px;
}

/* AI 小幫手 */
.ai-box{
  margin-top:10px;
}

.ai-messages{
  background:#f5f8fc;
  border:1px solid #e1e8f0;
  border-radius:15px;
  padding:15px;
  height:300px;
  overflow-y:auto;
  margin-bottom:12px;
}

.ai-message{
  margin-bottom:12px;
  display:flex;
}

.ai-message.user{
  justify-content:flex-end;
}

.ai-bubble{
  max-width:85%;
  padding:11px 15px;
  border-radius:15px;
  line-height:1.6;
  font-size:14px;
}

.ai-message.bot .ai-bubble{
  background:#e9f0ff;
}

.ai-message.user .ai-bubble{
  background:#2d6cdf;
  color:white;
}

.ai-input-area{
  display:flex;
  gap:8px;
}

.ai-input{
  flex:1;
  border:1px solid #d7e0ea;
  border-radius:12px;
  padding:12px;
  font-size:15px;
  outline:none;
}

.ai-input:focus{
  border-color:#2d6cdf;
}

.ai-send{
  border:none;
  background:#2d6cdf;
  color:white;
  border-radius:12px;
  padding:0 18px;
  cursor:pointer;
  font-size:15px;
  font-weight:700;
}

.ai-send:hover{
  background:#1f58bd;
}

.ai-hint{
  font-size:13px;
  color:var(--muted);
  margin-top:10px;
}

/* RWD */
@media(max-width:800px){
  .grid{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:520px){
  header{
    padding:30px 18px 45px;
  }

  .hero{
    margin-top:28px;
  }

  .grid{
    grid-template-columns:1fr;
  }

  section{
    padding:25px 18px 35px;
  }

  .ai-input-area{
    flex-direction:column;
  }

  .ai-send{
    padding:12px;
  }
}
</style>
</head>

<div class="modal"

<script>

/* =========================
   一般資訊視窗
========================= */

    </a>


    <div class="option"

/* =========================

========================= */

function openAI(){

  document.getElementById("modalSub").textContent =
    "有問題都可以問問看";

  document.getElementById("modalText").innerHTML = `

    <div class="ai-box">

      <div class="ai-messages" id="aiMessages">

        <div class="ai-message bot">

          <div class="ai-bubble">
            👋 你好！我是蘭潭圖書館 AI 小幫手。<br><br>
            你可以問我圖書館相關問題，例如：<br>
            「自習室還有位置嗎？」<br>
            「我要去哪裡找書？」<br>
            「圖書館可以列印嗎？」
          </div>

        </div>

      </div>


      <div class="ai-input-area">

        <input
          type="text"
          id="aiInput"
          class="ai-input"

          onkeydown="if(event.key==='Enter') askAI()"
        >

          class="ai-send"
          onclick="askAI()">
          送出
        </button>

/* =========================
   AI 回答邏輯
========================= */

function askAI(){

  const input =
    document.getElementById("aiInput");

  const question =
    input.value.trim();

  if(!question){
    return;
  }


  const messages =
    document.getElementById("aiMessages");


  /* 顯示使用者問題 */

  const userMessage =
    document.createElement("div");

  userMessage.className =
    "ai-message user";

  userMessage.innerHTML = `
    <div class="ai-bubble">
      ${escapeHTML(question)}
    </div>
  `;

  messages.appendChild(userMessage);


  /* 產生回答 */

  const answer =
    getAIAnswer(question);


  /* 顯示 AI 回答 */

  const botMessage =
    document.createElement("div");

  botMessage.className =
    "ai-message bot";

  botMessage.innerHTML = `
    <div class="ai-bubble">
      🤖 ${answer}
    </div>
  `;

  messages.appendChild(botMessage);


  input.value = "";

  messages.scrollTop =
    messages.scrollHeight;
}


/* =========================
   AI 問答資料
========================= */

function getAIAnswer(question){

  const q =
    question.toLowerCase();


  /* 自習室 */

  if(
    q.includes("自習") ||
    q.includes("位置") ||
    q.includes("座位") ||
    q.includes("有位子")
  ){

    return `
      目前這個網站可以提供自習空間的相關資訊，
      但目前還沒有連接圖書館即時座位系統，
      因此無法即時確認目前是否還有空位。<br><br>

      📖 如果你要使用自習空間，
      可以前往蘭潭圖書館的自修區查看現場座位狀況。
    `;

  }


  /* 找書 */

  if(
    q.includes("找書") ||
    q.includes("哪裡找書") ||
    q.includes("查書") ||
    q.includes("館藏")
  ){

    return `
      📚 你可以使用「館藏查詢」功能搜尋圖書館的書籍、
      期刊與其他館藏資料。<br><br>

      回到首頁後，點選「館藏與閱讀資源」，
      再選擇「館藏查詢」即可開始搜尋。
    `;

  }


  /* 電子書 */

  if(
    q.includes("電子書") ||
    q.includes("電子資源")
  ){

    return `
      📱 你可以從「館藏與閱讀資源」進入「電子書查詢」，
      查看圖書館提供的電子書與電子資源。
    `;

  }


  /* 列印 */

  if(
    q.includes("列印") ||
    q.includes("印東西") ||
    q.includes("印")
  ){

    return `
      🖨️ 嘉大蘭潭圖書館提供列印、影印與掃描等資訊服務，
      可以協助你處理課程資料、報告與學習文件。
    `;

  }


  /* 會議室 */

  if(
    q.includes("會議室") ||
    q.includes("團體室") ||
    q.includes("預約")
  ){

    return `
      🎬 如果你想使用視聽團體室或會議室，
      可以從首頁的「視聽與會議設施」進入，
      查看相關資訊與預約服務。
    `;

  }


  /* 電腦 */

  if(
    q.includes("電腦") ||
    q.includes("網路") ||
    q.includes("wifi")
  ){

    return `
      💻 圖書館提供電腦與網路等資訊設備，
      可以用於資料查詢、學習與研究。
    `;

  }


  /* 展覽 */

  if(
    q.includes("展覽") ||
    q.includes("藝文") ||
    q.includes("作品")
  ){

    return `
      🎨 蘭潭圖書館有藝文系列展、作品展及特色文物展覽。
      你可以點選首頁的「藝文展覽功能」查看相關展覽資訊。
    `;

  }


  /* 開放時間 */

  if(
    q.includes("開放") ||
    q.includes("幾點") ||
    q.includes("時間")
  ){

    return `
      🕐 關於圖書館目前的開放時間，
      建議以嘉義大學圖書館官方公告為準，
      以免遇到寒暑假、國定假日或特殊活動而有所調整。
    `;

  }


  /* 預設回答 */

  return `
    🤔 這個問題我目前還沒有足夠的資訊可以回答。<br><br>

    你可以試著問我：<br>
    • 自習室還有位置嗎？<br>
    • 我要去哪裡找書？<br>
    • 圖書館可以列印嗎？<br>
    • 電子書要去哪裡查？<br>
    • 會議室怎麼預約？
  `;

}


/* =========================
   防止使用者輸入 HTML
========================= */

function escapeHTML(text){

  const div =
    document.createElement("div");

  div.textContent = text;

  return div.innerHTML;
}


/* =========================
   關閉視窗
========================= */

function closeInfo(){

  document
    .getElementById("modal")
    .classList.remove("show");
}


/* =========================
   鍵盤操作
========================= */

document
.querySelectorAll("#cards .card")
.forEach(card => {

  card.addEventListener("keydown", event => {

    if(
      event.key === "Enter" ||
      event.key === " "
    ){

      event.preventDefault();

      card.click();

    }

  });

});


/* ESC 關閉 */

document.addEventListener(
  "keydown",
  event => {

    if(event.key === "Escape"){

      closeInfo();

    }

  }
);

</script>
